<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANVI – Phát triển bản thân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --g1:#0B4F27; --g2:#157A3A; --g3:#26A04B; --g4:#7ED37A;
  --grad:linear-gradient(135deg,#0B5D2E,#1F9A47 60%,#5EBD5F);
  --than:#E8833A; --tam:#D64D86; --tue:#2F7FD1;
  --k1:#0EA5E9; --k2:#16A34A; --k3:#F59E0B; --k4:#8B5CF6; --k5:#EF4444;
  --bg:#EFF6EF; --surface:#FFFFFF; --surface-2:#F5FAF5; --line:#D9E8DA;
  --text:#132A1B; --muted:#5A7262; --cell-empty:#E4EEE4;
  --up:#15803D; --down:#DC2626;
  --shadow:0 1px 2px rgba(10,60,30,.06),0 8px 24px -12px rgba(10,60,30,.2);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1510; --surface:#12211A; --surface-2:#172A20; --line:#244031;
    --text:#E5F2E8; --muted:#9AB7A3; --cell-empty:#1E3628; --up:#4ADE80; --down:#F87171; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1510; --surface:#12211A; --surface-2:#172A20; --line:#244031;
  --text:#E5F2E8; --muted:#9AB7A3; --cell-empty:#1E3628; --up:#4ADE80; --down:#F87171; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
img{max-width:100%}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;color:#fff;padding:22px 14px 18px;overflow:hidden;
  background:radial-gradient(100% 50% at 50% 0%,rgba(255,255,255,.14),transparent 70%),radial-gradient(120% 55% at 50% 112%,rgba(160,230,120,.45),transparent 65%),linear-gradient(175deg,#08401F,#136B33 55%,#2E9A4B)}
.brand{display:flex;flex-direction:column;align-items:center;padding:0 8px 18px;text-align:center}
.brand img{width:118px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.brand small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:8px}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:rgba(255,255,255,.8);padding:10px 12px;border-radius:12px;text-align:left;font-weight:500;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #B8F0A0}
.nav .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(0,40,15,.32);flex:none}
.nav .ico svg{width:19px;height:19px;stroke:#C8FF8A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(200,255,138,.45))}
.nav button[aria-current="page"] .ico{background:#C8FF8A}
.nav button[aria-current="page"] .ico svg{stroke:#0B4F27;filter:none}
.tico{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--grad);vertical-align:-8px;margin-right:10px}
.tico svg{width:22px;height:22px;stroke:#C8FF8A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Videos */
.vtabs{display:flex;gap:10px;flex-wrap:wrap}
.vtab{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.vtab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.vtab small{font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px}
.vtab[aria-pressed="true"]{background:var(--c);color:#fff;border-color:transparent}
.vtab[aria-pressed="true"] i{background:#fff}
.vtab[aria-pressed="true"] small{background:rgba(255,255,255,.25);color:#fff}
.vadd{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 150px;gap:12px}
.vadd .full{grid-column:1/-1}
.vadd textarea{min-height:76px}
.vgroup{border-top:5px solid var(--c)}
.vgroup>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vgroup>header h3{margin:0;color:var(--c)}
.vgroup>header span{font-size:13px;color:var(--muted);font-weight:600}
.vlist{display:flex;flex-direction:column;gap:12px}
.vitem{border-radius:14px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--c);padding:10px 12px 12px 10px}
.vrow{display:flex;align-items:center;gap:14px}
.vplay{width:56px;height:40px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.vplay svg{width:20px;height:20px;fill:#fff}
.vrow .vt{flex:1;min-width:0}
.vrow .vt b{display:block;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vrow .vt span{font-size:12.5px;color:var(--muted)}
.vrow a.watch{text-decoration:none;border:0;color:#fff;background:var(--grad);border-radius:10px;padding:8px 18px;font-weight:700;font-size:14px;flex:none}
.vrow a.watch:hover{filter:brightness(1.08)}
.vsum{margin:10px 0 0 70px}
.vsum label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.vsum label em{font-style:normal;font-weight:500;color:var(--g3)}
.vsum textarea{min-height:64px;font-size:14px;background:var(--surface)}
.vnote{font-size:13px;margin-top:8px;color:var(--muted)}
.vnote.warn{color:var(--down);font-weight:600}
@media (max-width:860px){.vadd{grid-template-columns:1fr}.vrow{flex-wrap:wrap}.vrow .vt{flex-basis:calc(100% - 80px)}.vsum{margin-left:0}}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.mini-quote{border:0;text-align:left;background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:13px;font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.5}
.mini-quote span{display:block;font-family:var(--sans);font-style:normal;font-size:11.5px;opacity:.7;margin-top:6px}
.status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px;padding:0 4px}
.status i{width:8px;height:8px;border-radius:50%;background:#A3A3A3;display:inline-block}
.status[data-s="cloud"] i{background:#86EFAC}.status[data-s="saving"] i{background:#FACC15}.status[data-s="error"] i{background:#F87171}

/* Main */
.main{min-width:0;padding:22px 30px 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:220px}
.top h2 small{display:block;font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}
.datebar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.datebar button{border:0;background:transparent;border-radius:10px;padding:7px 10px;font-weight:600}
.datebar button:hover{background:var(--surface-2)}
.datebar input{border:0;background:transparent;padding:6px 4px;font-weight:600}
.today-btn{background:var(--grad)!important;color:#fff;padding:7px 14px!important}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;font-size:17px}

.grid{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:17px;font-weight:700}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{border:0;color:#fff;background:var(--grad)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--grad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;color:var(--muted);font-size:15px;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
input.f,textarea.f,select.f{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--g3);box-shadow:0 0 0 3px color-mix(in srgb,var(--g3) 20%,transparent)}
textarea.f{resize:vertical;min-height:92px;line-height:1.5}
label.lb{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.mx-wrap{overflow-x:auto}

/* Period bar */
.pbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.pbar input[type=date],.pbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:13.5px}
.pbar .lbl{font-size:13px;color:var(--muted);font-weight:500}
.pbar .lbl b{color:var(--text)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-22px;top:-22px;width:78px;height:78px;border-radius:50%;background:var(--c,var(--g3));opacity:.12}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.15;color:var(--c,var(--text));letter-spacing:-.02em}
.stat>span{font-size:13px;color:var(--muted);font-weight:500;display:block}
.stat .cmp{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gr{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--cell-empty);color:var(--muted)}
.gr.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.gr.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.sec-title{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sec-title h3{margin:0}

table.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{text-align:left;font-size:12.5px;color:#fff;padding:9px 10px;background:var(--c,var(--g2));font-weight:700;white-space:nowrap}
.list th:first-child{border-top-left-radius:10px}.list th:last-child{border-top-right-radius:10px}
.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap}
.list td.d{white-space:nowrap;font-weight:700;cursor:pointer}
.list td.num{text-align:right;font-weight:700;white-space:nowrap}

/* Habits hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:22px 26px;border-radius:22px;color:#fff;
  background:radial-gradient(80% 140% at 100% 0%,rgba(190,240,140,.45),transparent 60%),var(--grad)}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#D9F99D calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
.ring>div{width:92px;height:92px;border-radius:50%;background:rgba(6,50,24,.85);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;font-weight:800;line-height:1}
.ring small{font-size:11px;opacity:.8}
.hero h3{margin:0 0 4px;font-size:20px}
.hero p{margin:0 0 14px;opacity:.88;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.catbar{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.catbar .row{justify-content:space-between;font-size:13px;font-weight:600}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .3s}

/* Habit + calendar combined table */
table.hx{border-collapse:separate;border-spacing:0 4px;font-size:12px;min-width:100%}
.hx th{color:var(--muted);font-weight:600;font-size:11px;padding:0 1px 4px;text-align:center}
.hx th.sel{color:var(--text);font-weight:800}
.hx .hn,.hx .hin{position:sticky;background:var(--surface);z-index:2}
.hx .hn{left:0;width:220px;min-width:220px;max-width:220px;text-align:left;padding:6px 10px 6px 0}
.hx .hin{left:220px;width:150px;min-width:150px;padding:0 10px 0 4px;box-shadow:6px 0 8px -8px rgba(0,0,0,.2)}
.hx td.hn{border-left:5px solid var(--c);padding-left:10px;border-radius:10px 0 0 10px;background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.hx td.hin{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.hx .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.hx .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx .meta{font-size:11.5px;color:var(--muted)}
.hx tr.grp td{padding:10px 0 2px}
.hx tr.grp .hn{border:0;background:var(--surface)}
.hx td.c{width:24px;min-width:24px;height:30px;border-radius:6px;background:color-mix(in srgb,var(--c) var(--r),var(--cell-empty));color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center;border:2px solid var(--surface)}
.hx td.c.future{opacity:.45}
.hx td.c.sel{border-color:var(--text)}
.hx td.rate{font-weight:800;padding-left:10px;white-space:nowrap;text-align:right}
.hx tr.total td.c{background:color-mix(in srgb,var(--g3) var(--r),var(--cell-empty))}
.stepper{display:flex;align-items:center;gap:3px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;flex:none}
.stepper input{width:52px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 2px;font-weight:700}
.pct{min-width:36px;text-align:right;font-weight:800;font-size:12.5px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head b{font-size:16px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:2px 0}
.cal-cell{min-height:70px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal-cell:hover{border-color:var(--g3)}
.cal-cell .dn{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal-cell.today .dn{color:#fff;background:var(--grad);border-radius:7px;padding:0 6px;align-self:flex-start}
.cal-cell.sel{border-color:var(--g3);box-shadow:0 0 0 2px var(--g3) inset}
.cal-cell.blank{visibility:hidden}
.cal-cell .snip{font-size:11px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-big{font-size:17px;font-weight:800;line-height:1}

/* Karma */
.goal-pin{border-radius:20px;color:#fff;padding:18px 20px;background:radial-gradient(70% 120% at 100% 0%,rgba(200,245,160,.4),transparent 60%),var(--grad);position:relative}
.goal-pin h3{margin:0;font-size:18px}
.goal-pin .sub2{opacity:.85;font-size:13px}
.goal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.goal-item{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal-item .gh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.goal-item .gh i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.goal-item p{margin:0;font-size:13.5px;white-space:pre-wrap;line-height:1.45}
.goal-item .cnt{margin-top:auto;font-size:12px;opacity:.9}
.goal-pin .btn{border:0;background:rgba(255,255,255,.2);color:#fff}
.goal-pin .btn:hover{background:rgba(255,255,255,.3)!important}
.goal-pin details{margin-top:12px;font-size:13px}
.goal-pin summary{cursor:pointer;opacity:.9}
.kpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.krows{display:flex;flex-direction:column;gap:8px}
.krow{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--c)}
.krow select{border:0;background:transparent;font-weight:700;color:var(--c);padding:6px 2px 6px 8px;max-width:138px;outline:none}
.krow input[data-f="t"]{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;outline:none}
.krow.done input[data-f="t"]{text-decoration:line-through;color:var(--muted)}
.krow input[type=checkbox]{width:18px;height:18px;accent-color:var(--g3);flex:none}
.quick-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.quick-add button{border:1px dashed var(--c);color:var(--c);background:transparent;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
.quick-add button:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}

/* Gratitude */
.grat-hero{border-radius:22px;padding:20px 24px;color:#0B3D1D;background:linear-gradient(135deg,#E7F9D7,#BDEBA4 55%,#9BDD8C)}
.grat-hero input{background:rgba(255,255,255,.7);border:1px solid rgba(11,79,39,.2);color:#0B3D1D;font-weight:600;font-size:16px}
.grat-hero label.lb{color:#1F5C33}
.grat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.gitem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px}
.gitem .n{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--cell-empty);color:var(--muted)}
.gitem.ok .n{background:var(--grad);color:#fff}
.gitem input{border:0;background:transparent;outline:none;flex:1;padding:8px 2px;min-width:0}
.submit-zone{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.thank-btn{border:0;border-radius:14px;padding:13px 28px;font-weight:800;font-size:16px;color:#fff;background:var(--grad);box-shadow:0 8px 22px -8px rgba(21,122,58,.7)}
.thank-btn.sent{background:var(--surface-2);color:var(--g2);box-shadow:none;border:1px solid var(--line)}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.topics span{background:color-mix(in srgb,var(--g3) 14%,var(--surface));color:var(--g2);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}
.gday{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--surface-2)}
.gday summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.gday ol{margin:8px 0 2px;padding-left:22px;font-size:14px}

/* Order */
.cosmos{border-radius:22px;padding:22px 26px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(60% 90% at 90% 100%,rgba(140,220,110,.45),transparent),linear-gradient(135deg,#052814,#0D4F28 60%,#1E8A42)}
.cosmos h3{font-size:20px;margin:0 0 4px}
.cosmos p{margin:0;opacity:.85;font-size:14px}
table.order{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:760px}
.order th{text-align:left;font-size:13px;font-weight:700;padding:4px 8px;color:var(--muted)}
.order th span{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.order td{padding:0 4px;vertical-align:top}
.order textarea{min-height:70px;font-size:14px}
.order td.real textarea{background:color-mix(in srgb,var(--g3) 9%,var(--surface-2))}

/* Journal */
.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.jcard{border-radius:18px;padding:16px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 55%)}
.jcard h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.jcard textarea{min-height:160px;background:var(--surface)}
.moods{display:flex;gap:6px}
.moods button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;width:44px;height:44px;font-size:21px;transition:transform .12s}
.moods button[aria-pressed="true"]{border-color:var(--g3);background:color-mix(in srgb,var(--g3) 18%,var(--surface));transform:scale(1.08)}
.ai-card{border-radius:20px;padding:20px;border:1px solid color-mix(in srgb,var(--g3) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--g4) 18%,var(--surface)),var(--surface) 60%)}
.ai-out{margin-top:14px;font-size:14.5px;line-height:1.65}
.ai-out h4{margin:16px 0 6px;font-size:15.5px;color:var(--g2)}
.ai-out ul{margin:4px 0;padding-left:20px}
.ai-out p{margin:6px 0}
.ai-note{font-size:13px;color:var(--muted)}

/* Quotes */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.banner{border-radius:20px;color:#fff;padding:22px;min-height:180px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--g)}
.banner::before{content:"“";position:absolute;right:14px;top:-26px;font-family:var(--serif);font-size:150px;opacity:.18;line-height:1}
.banner .kind{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;align-self:flex-start}
.banner q{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;margin:14px 0 8px;quotes:none}
.banner .au{font-size:13px;opacity:.85}
.banner .acts{margin-top:auto;padding-top:14px;display:flex;gap:6px;align-items:center}
.banner .acts button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.banner .acts button:hover{background:rgba(255,255,255,.32)}
.banner.off{filter:grayscale(.85);opacity:.6}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:11px;border:2px solid transparent;background:var(--g)}
.swatches button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;font-size:14px}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--cell-empty);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--grad)}
.switch input:checked::after{transform:translateX(18px)}

/* Report */
.rep-sec{border-left:5px solid var(--c);padding-left:16px}
.trend{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px;min-width:100%}
.trend .b{flex:1;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;cursor:pointer}
.trend .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--grad);min-height:2px}
.trend .b small{font-size:10px;color:var(--muted)}
.rep-hero{border-radius:22px;padding:22px 26px;color:#fff;background:radial-gradient(80% 140% at 100% 0%,rgba(190,240,140,.4),transparent 60%),var(--grad);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.rep-hero div b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.rep-hero div span{font-size:13px;opacity:.88}
.rep-hero .gr{background:rgba(255,255,255,.22);color:#fff}

/* Modal + popup */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,30,15,.55);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:min(520px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.modal .fld{margin-bottom:12px}
.popup{width:min(620px,100%);border-radius:28px;color:#fff;padding:40px 40px 30px;text-align:center;position:relative;overflow:hidden;background:var(--g);box-shadow:0 40px 100px rgba(0,0,0,.45);animation:pop .55s cubic-bezier(.2,.9,.3,1.2)}
.popup .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 60s linear infinite}
.popup>*:not(.rays){position:relative}
.popup .plogo{width:74px;margin:0 auto 6px;display:block}
.popup .kind{display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 14px;border-radius:99px}
.popup q{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(22px,4vw,31px);line-height:1.4;margin:20px 0 12px;quotes:none}
.popup .au{opacity:.85;font-size:15px}
.popup .row{justify-content:center;margin-top:26px}
.popup .btn{border:0;background:rgba(255,255,255,.22);color:#fff}
.popup .btn.go{background:#fff;color:#0B5D2E}
.popup .greet{font-size:14px;opacity:.88;margin-bottom:10px}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.popup,.popup .rays{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0B3D1D;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}

@media (max-width:1150px){.goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.kpair{grid-template-columns:1fr}.jgrid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:10px 12px;flex-direction:row;align-items:center;gap:10px}
  .brand{padding:0}.brand img{width:46px}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;flex:1}
  .nav button{white-space:nowrap;padding:8px 10px;font-size:13.5px}
  .nav .ico{width:26px;height:26px}.nav .ico svg{width:16px;height:16px}
  .side-foot{display:none}
  .main{padding:16px 14px 40px}
  .hero{grid-template-columns:1fr;justify-items:start}
  .cats{grid-template-columns:1fr}
  .grat-list{grid-template-columns:1fr}
  .goal-grid{grid-template-columns:1fr}
  .cal-cell{min-height:52px;padding:4px}
  .cal-cell .snip{display:none}
  .hx .hn{width:130px;min-width:130px;max-width:130px}
  .hx .hin{left:130px;width:142px;min-width:142px}
  .stepper input{width:40px}
}
/* Auth & accounts */
body.locked .app{display:none}
.auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(100% 60% at 50% 0%,rgba(255,255,255,.14),transparent 70%),radial-gradient(120% 55% at 50% 112%,rgba(160,230,120,.45),transparent 65%),linear-gradient(175deg,#08401F,#136B33 55%,#2E9A4B)}
body.locked .auth{display:flex}
.auth-box{background:var(--surface);border-radius:22px;padding:28px 24px 22px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-box .alogo{display:block;width:96px;margin:-4px auto 10px;padding:12px 16px;border-radius:18px;background:var(--grad);box-sizing:content-box}
.auth-box h3{margin:0 0 4px;text-align:center;font-size:20px}
.auth-box .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;text-align:center}
.auth-box .fld{margin-bottom:12px}
.auth-box .btn.primary{width:100%;padding:11px;font-size:15px;margin-top:4px}
.auth-err{color:var(--down);font-size:13.5px;font-weight:600;min-height:20px;margin:2px 0 6px}
.auth-note{font-size:12.5px;color:var(--muted);margin:14px 0 0;text-align:center}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.who{border:0;text-align:left;background:rgba(0,40,15,.32);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;display:flex;align-items:center;gap:9px;min-width:0}
.who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{opacity:.75}
.who .av{width:30px;height:30px;border-radius:50%;background:#C8FF8A;color:#0B4F27;display:grid;place-items:center;font-weight:800;flex:none}
.who>div{min-width:0}
.acc-me{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.acc-me .av{width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.acc-me .info{flex:1;min-width:200px}
.acc-me .info b{display:block;font-size:17px;word-break:break-all}
.acc-me .info>span{color:var(--muted);font-size:13.5px}
.acc-add{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:10px;align-items:end}
.acc-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acc-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.acc-row .em{flex:1;min-width:180px;font-weight:600;word-break:break-all}
.acc-row .em small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--cell-empty);color:var(--muted)}
.badge.admin{background:var(--g2);color:#fff}
.badge.warn{background:#FEF3C7;color:#92400E}
.badge.ok{background:#DCFCE7;color:#166534}
.pw-hint{font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:860px){.acc-add{grid-template-columns:1fr}}
/* Mobile (điện thoại, Chrome Android/iOS) */
@media (max-width:860px){
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;margin-bottom:14px}
  .top h2{min-width:0;flex:none;font-size:22px}
  .top h2 small{font-size:12.5px}
  .top .tico{width:32px;height:32px;margin-right:8px}
  .top .tico svg{width:19px;height:19px}
  .datebar{grid-column:1/-1;grid-row:2;justify-content:space-between;padding:4px}
  .datebar input{min-width:0;flex:1;text-align:center}
  .datebar button{padding:8px 9px}
  .today-btn{padding:8px 12px!important}
  .theme-btn{grid-column:2;grid-row:1;width:40px;height:40px}
  .card{padding:16px;border-radius:16px}
  .card h3{font-size:16px}
  .hero{padding:18px;gap:18px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:12px 13px}
  .stat b{font-size:24px}
  .stat>span{font-size:12.5px}
  .pbar{gap:8px;padding:10px}
  .pbar .spacer{display:none}
  .seg button{padding:6px 9px;font-size:13px}
  input.f,textarea.f,select.f{font-size:16px}
  .btn{padding:9px 12px}
  .cosmos{padding:18px}
  .cosmos h3{font-size:17px}
  .auth-box{padding:24px 18px 18px}
}
</style>
</head>
<body class="locked">
<div class="auth" id="auth"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="assets/logo-anvi-trang.png" alt="ANVI"><small>Phát triển bản thân mỗi ngày</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="who" id="who" title="Mở trang tài khoản"></button>
      <button class="mini-quote" id="miniQuote" title="Mở châm ngôn"></button>
      <div class="status" id="status" data-s="local"><i></i><span>Đang kết nối…</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <h2 id="title"></h2>
      <div class="datebar">
        <button id="prevDay" aria-label="Ngày trước">‹</button>
        <input type="date" id="datePick" aria-label="Chọn ngày">
        <button id="nextDay" aria-label="Ngày sau">›</button>
        <button class="today-btn" id="todayBtn">Hôm nay</button>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng tối">◐</button>
    </div>
    <section id="view"></section>
  </main>
</div>

<div class="overlay" id="modalOv"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="popupOv"><div class="popup" id="popup" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/app.js"></script>
</body>
