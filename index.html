<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANVI – Phát triển bản thân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --g1:#0B4F27; --g2:#157A3A; --g3:#26A04B; --g4:#7ED37A;
  --grad:linear-gradient(135deg,#0B5D2E,#1F9A47 60%,#5EBD5F);
  --than:#E8833A; --tam:#D64D86; --tue:#2F7FD1;
  --k1:#0EA5E9; --k2:#16A34A; --k3:#F59E0B; --k4:#8B5CF6; --k5:#EF4444;
  --bg:#EFF6EF; --surface:#FFFFFF; --surface-2:#F5FAF5; --line:#D9E8DA;
  --text:#132A1B; --muted:#5A7262; --cell-empty:#E4EEE4;
  --up:#15803D; --down:#DC2626;
  --shadow:0 1px 2px rgba(10,60,30,.06),0 8px 24px -12px rgba(10,60,30,.2);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1510; --surface:#12211A; --surface-2:#172A20; --line:#244031;
    --text:#E5F2E8; --muted:#9AB7A3; --cell-empty:#1E3628; --up:#4ADE80; --down:#F87171; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1510; --surface:#12211A; --surface-2:#172A20; --line:#244031;
  --text:#E5F2E8; --muted:#9AB7A3; --cell-empty:#1E3628; --up:#4ADE80; --down:#F87171; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
img{max-width:100%}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;color:#fff;padding:22px 14px 18px;overflow:hidden;
  background:radial-gradient(100% 50% at 50% 0%,rgba(255,255,255,.14),transparent 70%),radial-gradient(120% 55% at 50% 112%,rgba(160,230,120,.45),transparent 65%),linear-gradient(175deg,#08401F,#136B33 55%,#2E9A4B)}
.brand{display:flex;flex-direction:column;align-items:center;padding:0 8px 18px;text-align:center}
.brand img{width:118px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.brand small{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:8px}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:rgba(255,255,255,.8);padding:10px 12px;border-radius:12px;text-align:left;font-weight:500;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #B8F0A0}
.nav .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(0,40,15,.32);flex:none}
.nav .ico svg{width:19px;height:19px;stroke:#C8FF8A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(200,255,138,.45))}
.nav button[aria-current="page"] .ico{background:#C8FF8A}
.nav button[aria-current="page"] .ico svg{stroke:#0B4F27;filter:none}
.tico{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--grad);vertical-align:-8px;margin-right:10px}
.tico svg{width:22px;height:22px;stroke:#C8FF8A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Videos */
.vtabs{display:flex;gap:10px;flex-wrap:wrap}
.vtab{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.vtab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.vtab small{font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 8px}
.vtab[aria-pressed="true"]{background:var(--c);color:#fff;border-color:transparent}
.vtab[aria-pressed="true"] i{background:#fff}
.vtab[aria-pressed="true"] small{background:rgba(255,255,255,.25);color:#fff}
.vadd{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 150px;gap:12px}
.vadd .full{grid-column:1/-1}
.vadd textarea{min-height:76px}
.vgroup{border-top:5px solid var(--c)}
.vgroup>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vgroup>header h3{margin:0;color:var(--c)}
.vgroup>header span{font-size:13px;color:var(--muted);font-weight:600}
.vlist{display:flex;flex-direction:column;gap:12px}
.vitem{border-radius:14px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--c);padding:10px 12px 12px 10px}
.vrow{display:flex;align-items:center;gap:14px}
.vplay{width:56px;height:40px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.vplay svg{width:20px;height:20px;fill:#fff}
.vrow .vt{flex:1;min-width:0}
.vrow .vt b{display:block;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vrow .vt span{font-size:12.5px;color:var(--muted)}
.vrow a.watch{text-decoration:none;border:0;color:#fff;background:var(--grad);border-radius:10px;padding:8px 18px;font-weight:700;font-size:14px;flex:none}
.vrow a.watch:hover{filter:brightness(1.08)}
.vsum{margin:10px 0 0 70px}
.vsum label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.vsum label em{font-style:normal;font-weight:500;color:var(--g3)}
.vsum textarea{min-height:64px;font-size:14px;background:var(--surface)}
.vnote{font-size:13px;margin-top:8px;color:var(--muted)}
.vnote.warn{color:var(--down);font-weight:600}
@media (max-width:860px){.vadd{grid-template-columns:1fr}.vrow{flex-wrap:wrap}.vrow .vt{flex-basis:calc(100% - 80px)}.vsum{margin-left:0}}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.mini-quote{border:0;text-align:left;background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:13px;font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.5}
.mini-quote span{display:block;font-family:var(--sans);font-style:normal;font-size:11.5px;opacity:.7;margin-top:6px}
.status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px;padding:0 4px}
.status i{width:8px;height:8px;border-radius:50%;background:#A3A3A3;display:inline-block}
.status[data-s="cloud"] i{background:#86EFAC}.status[data-s="saving"] i{background:#FACC15}.status[data-s="error"] i{background:#F87171}

/* Main */
.main{min-width:0;padding:22px 30px 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:220px}
.top h2 small{display:block;font-size:13.5px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}
.datebar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.datebar button{border:0;background:transparent;border-radius:10px;padding:7px 10px;font-weight:600}
.datebar button:hover{background:var(--surface-2)}
.datebar input{border:0;background:transparent;padding:6px 4px;font-weight:600}
.today-btn{background:var(--grad)!important;color:#fff;padding:7px 14px!important}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;font-size:17px}

.grid{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:17px;font-weight:700}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{border:0;color:#fff;background:var(--grad)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--grad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;color:var(--muted);font-size:15px;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
input.f,textarea.f,select.f{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--g3);box-shadow:0 0 0 3px color-mix(in srgb,var(--g3) 20%,transparent)}
textarea.f{resize:vertical;min-height:92px;line-height:1.5}
label.lb{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.mx-wrap{overflow-x:auto}

/* Period bar */
.pbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.pbar input[type=date],.pbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:13.5px}
.pbar .lbl{font-size:13px;color:var(--muted);font-weight:500}
.pbar .lbl b{color:var(--text)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-22px;top:-22px;width:78px;height:78px;border-radius:50%;background:var(--c,var(--g3));opacity:.12}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.15;color:var(--c,var(--text));letter-spacing:-.02em}
.stat>span{font-size:13px;color:var(--muted);font-weight:500;display:block}
.stat .cmp{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gr{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--cell-empty);color:var(--muted)}
.gr.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.gr.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.sec-title{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sec-title h3{margin:0}

table.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{text-align:left;font-size:12.5px;color:#fff;padding:9px 10px;background:var(--c,var(--g2));font-weight:700;white-space:nowrap}
.list th:first-child{border-top-left-radius:10px}.list th:last-child{border-top-right-radius:10px}
.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap}
.list td.d{white-space:nowrap;font-weight:700;cursor:pointer}
.list td.num{text-align:right;font-weight:700;white-space:nowrap}

/* Habits hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:22px 26px;border-radius:22px;color:#fff;
  background:radial-gradient(80% 140% at 100% 0%,rgba(190,240,140,.45),transparent 60%),var(--grad)}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#D9F99D calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
.ring>div{width:92px;height:92px;border-radius:50%;background:rgba(6,50,24,.85);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;font-weight:800;line-height:1}
.ring small{font-size:11px;opacity:.8}
.hero h3{margin:0 0 4px;font-size:20px}
.hero p{margin:0 0 14px;opacity:.88;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.catbar{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.catbar .row{justify-content:space-between;font-size:13px;font-weight:600}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .3s}

/* Habit + calendar combined table */
table.hx{border-collapse:separate;border-spacing:0 4px;font-size:12px;min-width:100%}
.hx th{color:var(--muted);font-weight:600;font-size:11px;padding:0 1px 4px;text-align:center}
.hx th.sel{color:var(--text);font-weight:800}
.hx .hn,.hx .hin{position:sticky;background:var(--surface);z-index:2}
.hx .hn{left:0;width:220px;min-width:220px;max-width:220px;text-align:left;padding:6px 10px 6px 0}
.hx .hin{left:220px;width:150px;min-width:150px;padding:0 10px 0 4px;box-shadow:6px 0 8px -8px rgba(0,0,0,.2)}
.hx td.hn{border-left:5px solid var(--c);padding-left:10px;border-radius:10px 0 0 10px;background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.hx td.hin{background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.hx .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.hx .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx .meta{font-size:11.5px;color:var(--muted)}
.hx tr.grp td{padding:10px 0 2px}
.hx tr.grp .hn{border:0;background:var(--surface)}
.hx td.c{width:24px;min-width:24px;height:30px;border-radius:6px;background:color-mix(in srgb,var(--c) var(--r),var(--cell-empty));color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center;border:2px solid var(--surface)}
.hx td.c.future{opacity:.45}
.hx td.c.sel{border-color:var(--text)}
.hx td.rate{font-weight:800;padding-left:10px;white-space:nowrap;text-align:right}
.hx tr.total td.c{background:color-mix(in srgb,var(--g3) var(--r),var(--cell-empty))}
.stepper{display:flex;align-items:center;gap:3px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;flex:none}
.stepper input{width:52px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 2px;font-weight:700}
.pct{min-width:36px;text-align:right;font-weight:800;font-size:12.5px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head b{font-size:16px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:2px 0}
.cal-cell{min-height:70px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal-cell:hover{border-color:var(--g3)}
.cal-cell .dn{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal-cell.today .dn{color:#fff;background:var(--grad);border-radius:7px;padding:0 6px;align-self:flex-start}
.cal-cell.sel{border-color:var(--g3);box-shadow:0 0 0 2px var(--g3) inset}
.cal-cell.blank{visibility:hidden}
.cal-cell .snip{font-size:11px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-big{font-size:17px;font-weight:800;line-height:1}

/* Karma */
.goal-pin{border-radius:20px;color:#fff;padding:18px 20px;background:radial-gradient(70% 120% at 100% 0%,rgba(200,245,160,.4),transparent 60%),var(--grad);position:relative}
.goal-pin h3{margin:0;font-size:18px}
.goal-pin .sub2{opacity:.85;font-size:13px}
.goal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.goal-item{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal-item .gh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.goal-item .gh i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.goal-item p{margin:0;font-size:13.5px;white-space:pre-wrap;line-height:1.45}
.goal-item .cnt{margin-top:auto;font-size:12px;opacity:.9}
.goal-pin .btn{border:0;background:rgba(255,255,255,.2);color:#fff}
.goal-pin .btn:hover{background:rgba(255,255,255,.3)!important}
.goal-pin details{margin-top:12px;font-size:13px}
.goal-pin summary{cursor:pointer;opacity:.9}
.kpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.krows{display:flex;flex-direction:column;gap:8px}
.krow{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--c)}
.krow select{border:0;background:transparent;font-weight:700;color:var(--c);padding:6px 2px 6px 8px;max-width:138px;outline:none}
.krow input[data-f="t"]{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;outline:none}
.krow.done input[data-f="t"]{text-decoration:line-through;color:var(--muted)}
.krow input[type=checkbox]{width:18px;height:18px;accent-color:var(--g3);flex:none}
.quick-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.quick-add button{border:1px dashed var(--c);color:var(--c);background:transparent;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
.quick-add button:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}

/* Gratitude */
.grat-hero{border-radius:22px;padding:20px 24px;color:#0B3D1D;background:linear-gradient(135deg,#E7F9D7,#BDEBA4 55%,#9BDD8C)}
.grat-hero input{background:rgba(255,255,255,.7);border:1px solid rgba(11,79,39,.2);color:#0B3D1D;font-weight:600;font-size:16px}
.grat-hero label.lb{color:#1F5C33}
.grat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.gitem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px}
.gitem .n{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--cell-empty);color:var(--muted)}
.gitem.ok .n{background:var(--grad);color:#fff}
.gitem input{border:0;background:transparent;outline:none;flex:1;padding:8px 2px;min-width:0}
.submit-zone{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.thank-btn{border:0;border-radius:14px;padding:13px 28px;font-weight:800;font-size:16px;color:#fff;background:var(--grad);box-shadow:0 8px 22px -8px rgba(21,122,58,.7)}
.thank-btn.sent{background:var(--surface-2);color:var(--g2);box-shadow:none;border:1px solid var(--line)}

.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.ai-card{border-radius:20px;padding:20px;border:1px solid color-mix(in srgb,var(--g3) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--g4) 18%,var(--surface)),var(--surface) 60%)}

.banner.off{filter:grayscale(.85);opacity:.6}
.swatches{display:flex;gap:8px;flex-wrap:wrap}

.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;font-size:14px}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--cell-empty);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}

.switch input:checked{background:var(--grad)}

/* Report */
.rep-sec{border-left:5px solid var(--c);padding-left:16px}

const fmtShort=k=>{const d=parseKey(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fmtShortY=k=>{const d=parseKey(k);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const monthDays=k=>{const d=parseKey(k);const n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return Array.from({length:n},(_,i)=>`${k.slice(0,7)}-${pad(i+1)}`)};
const clamp01=x=>Math.max(0,Math.min(1,x));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const weekStart=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};

const AIRES={};
/* Mỗi tài khoản có kho dữ liệu riêng: tài khoản chủ dùng khoá cũ (giữ dữ liệu sẵn có), tài khoản khác dùng khoá kèm id */
function loadAccountData(acc){
  LS=acc.owner?LS_BASE:LS_BASE+':'+acc.id;DOCP=acc.owner?'':'a'+acc.id+'_';
  S={config:null,months:{}};
  try{const raw=localStorage.getItem(LS)||(acc.owner?localStorage.getItem(LS_OLD):null);if(raw)S=JSON.parse(raw)}catch(e){}
  S.config=normalizeConfig(S.config);S.months??={};
}
function normalizeConfig(c){c=c||DEFAULT_CONFIG();c.habits??=[];c.quotes??=[];c.karmaGoals??=[];c.videos??=[];if(c.popup===undefined)c.popup=true;return c}
S.config=normalizeConfig(S.config);

const getDay=k=>(S.months[k.slice(0,7)]?.days?.[k])||{};
function editDay(k){const ym=k.slice(0,7);S.months[ym]??={days:{}};S.months[ym].days??={};S.months[ym].days[k]??={};dirty('m-'+ym);return S.months[ym].days[k]}
function allDays(){const out={};for(const m of Object.values(S.months))Object.assign(out,m.days||{});return out}

let pending=new Set(),saveTimer=null;
function dirty(name){pending.add(name);clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);setStatus('saving')}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function flush(){
  saveLocal();
  if(!col){pending.clear();setStatus('local');return}
  const names=[...pending];pending.clear();
  try{
    for(const n of names){const body=n==='config'?S.config:S.months[n.slice(2)];if(body)await col.doc(DOCP+n).set(JSON.parse(JSON.stringify(body)))}
    setStatus('cloud');
  }catch(e){
    names.forEach(n=>pending.add(n));
    if(e&&e.code==='quota_exceeded'){setStatus('error','Bộ nhớ đầy – dữ liệu vẫn lưu trên trình duyệt');return}
    setStatus('error','Chưa lưu được – đang thử lại');setTimeout(flush,2500+Math.random()*1500);
  }
}
function setStatus(s,msg){const el=$('#status');el.dataset.s=s;el.querySelector('span').textContent=msg||({cloud:'Đã đồng bộ tài khoản',saving:'Đang lưu…',local:'Lưu trên trình duyệt này',error:'Lỗi lưu'})[s]}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000)}

/* ---------- Period & comparison ---------- */
const P={mode:'month',from:null,to:null,cmp:false,cmpMode:'prev',cfrom:null,cto:null};
const ord=(a,b)=>a<=b?{from:a,to:b}:{from:b,to:a};
function curRange(){
  if(P.mode==='day')return{from:cur,to:cur};
  if(P.mode==='week'){const w=weekStart(cur);return{from:w,to:addDays(w,6)}}
  if(P.mode==='month'){const m=monthDays(cur);return{from:m[0],to:m[m.length-1]}}
  return ord(P.from||addDays(cur,-6),P.to||cur);
}
function cmpRange(r){
  if(P.cmpMode==='custom'&&P.cfrom&&P.cto)return ord(P.cfrom,P.cto);
  if(P.mode==='month'){const d=parseKey(r.from);d.setMonth(d.getMonth()-1);const m=monthDays(keyOf(d));return{from:m[0],to:m[m.length-1]}}
  const n=rangeDays(r).length;return{from:addDays(r.from,-n),to:addDays(r.from,-1)};
}
function rangeDays(r){const out=[];let k=r.from;let g=0;while(k<=r.to&&g<1500){out.push(k);k=addDays(k,1);g++}return out}
const countDays=r=>{const t=TODAY();return rangeDays(r).filter(k=>k<=t)};
const rangeLabel=r=>r.from===r.to?fmtShortY(r.from):`${fmtShortY(r.from)} – ${fmtShortY(r.to)}`;
function periodBar(){
  const r=curRange();const c=cmpRange(r);
  const modes=[['day','Ngày'],['week','Tuần'],['month','Tháng'],['custom','Tùy chỉnh']];
  return `<div class="pbar">
   <div class="seg" role="group" aria-label="Kỳ báo cáo">${modes.map(([m,n])=>`<button data-pmode="${m}" aria-pressed="${P.mode===m}">${n}</button>`).join('')}</div>
   ${P.mode==='custom'?`<input type="date" data-pin="from" value="${r.from}" aria-label="Từ ngày"><span class="lbl">đến</span><input type="date" data-pin="to" value="${r.to}" aria-label="Đến ngày">`:`<span class="lbl">Kỳ: <b>${rangeLabel(r)}</b></span>`}
   <span class="spacer"></span>
   <label class="switch"><input type="checkbox" data-pcmp ${P.cmp?'checked':''}> So sánh</label>
   ${P.cmp?`<select data-pcm aria-label="Kỳ so sánh"><option value="prev" ${P.cmpMode==='prev'?'selected':''}>với kỳ trước</option><option value="custom" ${P.cmpMode==='custom'?'selected':''}>với kỳ tùy chỉnh</option></select>
     ${P.cmpMode==='custom'?`<input type="date" data-pin="cfrom" value="${c.from}" aria-label="So sánh từ"><span class="lbl">–</span><input type="date" data-pin="cto" value="${c.to}" aria-label="So sánh đến">`:`<span class="lbl">(${rangeLabel(c)})</span>`}`:''}
  </div>`;
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-pmode]');if(m){P.mode=m.dataset.pmode;if(P.mode==='custom'&&!P.from){P.from=addDays(cur,-6);P.to=cur}render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-pin]')&&t.value){P[t.dataset.pin]=t.value;if(t.dataset.pin.startsWith('c')){const c=cmpRange(curRange());P.cfrom??=c.from;P.cto??=c.to}render()}
  else if(t.matches('[data-pcmp]')){P.cmp=t.checked;render()}
  else if(t.matches('[data-pcm]')){P.cmpMode=t.value;if(t.value==='custom'){const c=cmpRange(curRange());P.cfrom=P.cfrom||c.from;P.cto=P.cto||c.to}render()}
});
function fmtVal(v,f){if(f==='%')return Math.round(v)+'%';if(f==='d1')return v?v.toFixed(1):'–';return Math.round(v).toLocaleString('vi-VN')}
function growth(a,b){
  if(!b){return a>0?'<span class="gr up">▲ Mới</span>':'<span class="gr">–</span>'}
  const g=(a-b)/Math.abs(b)*100;const cls=g>0.05?'up':g<-0.05?'down':'';
  return `<span class="gr ${cls}">${g>0.05?'▲':g<-0.05?'▼':'■'} ${Math.abs(g).toFixed(Math.abs(g)<10?1:0)}%</span>`;
}
function metricCards(list){
  const r=curRange(),c=cmpRange(r);
  return `<div class="stats">${list.map(m=>{const v=m.val(r);const showC=P.cmp&&!m.noCmp;const pv=showC?m.val(c):0;
    return `<div class="stat" style="--c:${m.c||'var(--g2)'}"><b>${fmtVal(v,m.fmt)}</b><span>${m.label}</span>${showC?`<div class="cmp">${growth(v,pv)}<span>kỳ so sánh: ${fmtVal(pv,m.fmt)}</span></div>`:(m.note?`<div class="cmp">${m.note}</div>`:'')}</div>`}).join('')}</div>`;
}
function summaryCard(title,sub,inner){return `<div class="card" id="summary"><div class="sec-title"><h3>📈 ${title}</h3></div>${sub?`<p class="sub">${sub}</p>`:''}${periodBar()}<div id="sumBody">${inner()}</div></div>`}

/* ---------- Calendar ---------- */
function calendar(cellFn){
  const first=parseKey(cur.slice(0,7)+'-01');const off=(first.getDay()+6)%7;const today=TODAY();
  let h=`<div class="cal-head"><button class="icon-btn" data-mshift="-1" aria-label="Tháng trước">‹</button><b>Tháng ${first.getMonth()+1}/${first.getFullYear()}</b><button class="icon-btn" data-mshift="1" aria-label="Tháng sau">›</button></div><div class="cal">`;
  h+=WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<off;i++)h+=`<div class="cal-cell blank"></div>`;
  for(const k of monthDays(cur)){const c=cellFn(k)||{};
    h+=`<button class="cal-cell ${k===today?'today':''} ${k===cur?'sel':''}" data-date="${k}" style="${c.style||''}" title="${esc(c.title||fmtLong(k))}"><span class="dn">${+k.slice(8)}</span>${c.html||''}</button>`}
  return h+'</div>';
}
document.addEventListener('click',e=>{

});

const VIEWS={},SUM={};

/* ---------- 1. Habits ---------- */
const hv=(k,h)=>{const v=getDay(k).habits?.[h.id];return typeof v==='number'?v:0};
const hRatio=(k,h)=>h.target>0?clamp01(hv(k,h)/h.target):0;
function dayScore(k,list=S.config.habits){if(!list.length)return 0;return list.reduce((s,h)=>s+hRatio(k,h),0)/list.length}
const monthCountable=()=>{const t=TODAY();return monthDays(cur).filter(k=>k<=t)};
function habitRateIn(h,days){return days.length?days.filter(k=>hv(k,h)>=h.target).length/days.length:0}
const HABIT_METRICS=()=>[
  {label:'Hoàn thành TB/ngày',fmt:'%',c:'var(--g2)',val:r=>avg(countDays(r).map(k=>dayScore(k)))*100},
  {label:'Ngày đạt 100%',fmt:'n',c:'var(--g3)',val:r=>countDays(r).filter(k=>S.config.habits.length&&dayScore(k)>=1).length},
  ...Object.entries(CATS).map(([cid,c])=>({label:`${c.ico} ${c.name} – TB`,fmt:'%',c:c.c,val:r=>{const l=S.config.habits.filter(h=>h.cat===cid);return l.length?avg(countDays(r).map(k=>dayScore(k,l)))*100:0}}))];
function habitTable(){
  const r=curRange(),c=cmpRange(r),ds=countDays(r),dc=countDays(c);
  if(!S.config.habits.length)return '';
  return `<div class="mx-wrap" style="margin-top:16px"><table class="list"><thead><tr><th>Thói quen</th><th>Tổng số lượng</th><th>Ngày đạt</th><th>Tỉ lệ đạt</th>${P.cmp?'<th>Kỳ so sánh</th><th>Tăng trưởng</th>':''}</tr></thead><tbody>
   ${S.config.habits.map(h=>{const tot=ds.reduce((s,k)=>s+hv(k,h),0),rate=habitRateIn(h,ds)*100,prate=habitRateIn(h,dc)*100;
    return `<tr><td><span style="color:${CATS[h.cat].c}">●</span> ${esc(h.name)}</td><td class="num">${fmtVal(tot,'n')} ${esc(h.unit)}</td><td class="num">${ds.filter(k=>hv(k,h)>=h.target).length}/${ds.length}</td><td class="num">${Math.round(rate)}%</td>${P.cmp?`<td class="num">${Math.round(prate)}%</td><td class="num">${growth(rate,prate)}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;
}
SUM.habits=()=>metricCards(HABIT_METRICS())+habitTable();

    rows+=list.map(h=>`<tr data-h="${h.id}" style="--c:${c.c}">
      <td class="hn"><div class="nm"><span title="${esc(h.name)}">${esc(h.name)}</span><button class="icon-btn" data-edit title="Sửa thói quen" style="width:24px;height:24px;font-size:13px">✎</button></div><div class="meta">${h.target} ${esc(h.unit)}/ngày</div></td>
      <td class="hin"><div class="stepper"><button data-step="-1" aria-label="Giảm">−</button><input type="number" min="0" step="any" inputmode="decimal" value="${getDay(cur).habits?.[h.id]??''}" placeholder="0" aria-label="Số lượng ${esc(h.name)} ngày ${fmtShort(cur)}"><button data-step="1" aria-label="Tăng">+</button><span class="pct">${Math.round(hRatio(cur,h)*100)}%</span></div></td>
      ${days.map(k=>{const r=hRatio(k,h);return `<td class="c ${k>t?'future':''} ${k===cur?'sel':''}" data-date="${k}" style="--r:${Math.round(r*100)}%" title="${fmtShort(k)}: ${hv(k,h)}/${h.target} ${esc(h.unit)}">${r>=1?'✓':''}</td>`}).join('')}
      <td class="rate" style="color:${c.c}">${Math.round(habitRateIn(h,mc)*100)}%</td></tr>`).join('');
  }
  $('#view').innerHTML=`<div class="grid">

  tb.addEventListener('click',e=>{const row=e.target.closest('[data-h]');if(!row)return;const id=row.dataset.h;

function setHabit(id,val){
  const d=editDay(cur);d.habits??={};
  if(val===''||isNaN(parseFloat(val)))delete d.habits[id];else d.habits[id]=Math.max(0,parseFloat(val));
  const h=S.config.habits.find(x=>x.id===id);const row=document.querySelector(`tr[data-h="${id}"]`);const r=hRatio(cur,h);

  const mc=monthCountable();row.querySelector('.rate').textContent=Math.round(habitRateIn(h,mc)*100)+'%';
  const ds=dayScore(cur);const tc=document.querySelector(`td[data-tot="${cur}"]`);if(tc){tc.style.setProperty('--r',Math.round(ds*100)+'%');tc.textContent=ds>0?Math.round(ds*100):''}
  $('#totPct').textContent=Math.round(ds*100)+'%';$('#totRate').textContent=Math.round(avg(mc.map(k=>dayScore(k)))*100)+'%';
  refreshHabitHero();clearTimeout(setHabit._t);setHabit._t=setTimeout(refreshSummary,400);

function habitForm(h){

/* ---------- 2. Karma ---------- */
function kLog(k){const d=getDay(k);if(d.karmaLog)return d.karmaLog;const legacy=[];if(d.karma)KCOLS.forEach(c=>{const t=(d.karma[c.id]||'').trim();if(t)legacy.push({g:c.id,t})});return legacy}
const kPlan=k=>getDay(k).karmaPlan||[];
const filled=a=>a.filter(x=>(x.t||'').trim());
const seedsIn=(r,g)=>rangeDays(r).reduce((s,k)=>s+filled(kLog(k)).filter(x=>!g||x.g===g).length,0);
const plansIn=r=>rangeDays(r).flatMap(k=>filled(kPlan(k)));
const KARMA_METRICS=()=>[
  {label:'Tổng việc đã gieo',fmt:'n',c:'var(--g2)',val:r=>seedsIn(r)},
  ...KCOLS.map(c=>({label:`${c.ico} ${c.name}`,fmt:'n',c:c.c,val:r=>seedsIn(r,c.id)})),
  {label:'Việc trong kế hoạch',fmt:'n',c:'var(--g3)',val:r=>plansIn(r).length},
  {label:'Tỉ lệ thực hiện kế hoạch',fmt:'%',c:'var(--g1)',val:r=>{const p=plansIn(r);return p.length?p.filter(x=>x.done).length/p.length*100:0}}];
SUM.karma=()=>{
  const r=curRange();const days=rangeDays(r).filter(k=>filled(kLog(k)).length);
  return metricCards(KARMA_METRICS())+`<h4 style="margin:18px 0 8px">Chi tiết việc đã gieo trong kỳ</h4>`+(days.length?`<div class="mx-wrap"><table class="list"><thead><tr><th>Ngày</th>${KCOLS.map(c=>`<th style="background:${c.c}">${c.name}</th>`).join('')}</tr></thead><tbody>${days.reverse().map(k=>`<tr><td class="d" data-date="${k}">${fmtShort(k)}</td>${KCOLS.map(c=>`<td>${filled(kLog(k)).filter(x=>x.g===c.id).map(x=>'• '+esc(x.t)).join('\n')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có việc gieo hạt nào trong kỳ này.</div>');
};
function goalPin(){
  const G=S.config.karmaGoals;const g=G[G.length-1];
  if(!g)return `<div class="goal-pin"><div class="row"><div><h3>📌 Mục tiêu gieo hạt tuần</h3><div class="sub2">Thiết lập mục tiêu cho từng nhóm – mục tiêu sẽ được ghim tại đây cho đến khi bạn tạo mục tiêu mới.</div></div><span class="spacer"></span><button class="btn" id="goalNew">+ Thiết lập mục tiêu tuần</button></div></div>`;
  const wr={from:g.week,to:addDays(g.week,6)};
  return `<div class="goal-pin"><div class="row"><div><h3>📌 Mục tiêu tuần ${fmtShort(wr.from)} – ${fmtShort(wr.to)}</h3><div class="sub2">Đang ghim · đã gieo ${seedsIn(wr)} việc trong tuần này</div></div><span class="spacer"></span><button class="btn sm" id="goalEdit">Sửa</button><button class="btn sm" id="goalNew">+ Tạo mục tiêu mới</button></div>
   <div class="goal-grid">${KCOLS.map(c=>`<div class="goal-item" style="--c:${c.c}"><div class="gh"><i></i>${c.name}</div><p>${esc(g.goals[c.id]||'—')}</p><div class="cnt">Đã gieo: <b>${seedsIn(wr,c.id)}</b> việc</div></div>`).join('')}</div>
   ${G.length>1?`<details><summary>Mục tiêu các tuần trước (${G.length-1})</summary>${G.slice(0,-1).reverse().map(o=>`<div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,.12);border-radius:10px"><b>Tuần ${fmtShort(o.week)} – ${fmtShort(addDays(o.week,6))}</b>${KCOLS.filter(c=>o.goals[c.id]).map(c=>`<div>• ${c.name}: ${esc(o.goals[c.id])}</div>`).join('')}</div>`).join('')}</details>`:''}</div>`;
}
function goalForm(edit){
  const G=S.config.karmaGoals;const g=edit?G[G.length-1]:{week:weekStart(cur),goals:{}};
  openModal(`<h3>${edit?'Sửa mục tiêu tuần':'Thiết lập mục tiêu tuần mới'}</h3>
   <div class="fld"><label class="lb" for="gWeek">Tuần bắt đầu từ (thứ hai)</label><input class="f" type="date" id="gWeek" value="${g.week}"></div>
   ${KCOLS.map(c=>`<div class="fld"><label class="lb" for="gg-${c.id}" style="color:${c.c}">${c.ico} ${c.name}</label><textarea class="f" id="gg-${c.id}" style="min-height:58px" placeholder="Mục tiêu gieo hạt tuần này…">${esc(g.goals[c.id]||'')}</textarea></div>`).join('')}
   <div class="row"><span class="spacer"></span><button class="btn" data-close>Huỷ</button><button class="btn primary" id="gSave">${edit?'Lưu thay đổi':'Ghim mục tiêu'}</button></div>`);
  $('#gSave').onclick=()=>{const goals=Object.fromEntries(KCOLS.map(c=>[c.id,$('#gg-'+c.id).value.trim()]));
    if(!Object.values(goals).some(Boolean)){toast('Nhập ít nhất một mục tiêu');return}
    const week=weekStart($('#gWeek').value||cur);
    if(edit)Object.assign(g,{week,goals});else G.push({id:uid(),week,created:TODAY(),goals});
    dirty('config');closeModal();render();toast(edit?'Đã lưu mục tiêu':'Đã ghim mục tiêu tuần mới')};
}
function kRow(kind,x){const c=KMAP[x.g]||KCOLS[0];
  return `<div class="krow ${kind==='plan'&&x.done?'done':''}" style="--c:${c.c}">
   ${kind==='plan'?`<input type="checkbox" data-f="done" ${x.done?'checked':''} aria-label="Đã làm" style="margin-left:8px">`:''}
   <select data-f="g" aria-label="Nhóm">${KCOLS.map(o=>`<option value="${o.id}" ${o.id===c.id?'selected':''}>${o.name}</option>`).join('')}</select>
   <input data-f="t" value="${esc(x.t||'')}" placeholder="${kind==='plan'?'Việc dự định gieo…':'Việc tốt đã gieo…'}">
   ${kind==='plan'?'<button class="btn sm" data-kgo title="Chuyển sang nhật ký gieo hạt">→ Gieo</button>':''}
   <button class="icon-btn" data-kdel title="Xoá dòng">✕</button></div>`}
VIEWS.karma=()=>{
  const plan=kPlan(cur),log=kLog(cur);
  $('#view').innerHTML=`<div class="grid">
   ${goalPin()}
   <div class="kpair">
     <div class="card"><h3>🗓️ Kế hoạch gieo hạt</h3><p class="sub">Những việc bạn dự định làm cho người khác ngày ${fmtShort(cur)}. Tick khi đã làm, hoặc bấm “→ Gieo” để ghi vào nhật ký.</p>
       <div class="krows" data-kind="plan">${plan.map(x=>kRow('plan',x)).join('')||''}</div>
       <div class="quick-add" data-add="plan">${KCOLS.map(c=>`<button data-g="${c.id}" style="--c:${c.c}">+ ${c.name}</button>`).join('')}</div></div>
     <div class="card"><h3>🌱 Nhật ký gieo hạt</h3><p class="sub">Mỗi dòng là một việc tốt bạn đã gieo trong ngày ${fmtShort(cur)}.</p>
       <div class="krows" data-kind="log">${log.map(x=>kRow('log',x)).join('')||''}</div>
       <div class="quick-add" data-add="log">${KCOLS.map(c=>`<button data-g="${c.id}" style="--c:${c.c}">+ ${c.name}</button>`).join('')}</div></div>
   </div>
   ${summaryCard('Tổng kết gieo hạt','Đếm số việc đã gieo cho từng nhóm trong kỳ',SUM.karma)}
  </div>`;
  const nb=$('#goalNew');if(nb)nb.onclick=()=>goalForm(false);const eb=$('#goalEdit');if(eb)eb.onclick=()=>goalForm(true);
  const save=kind=>{const rows=[...document.querySelectorAll(`.krows[data-kind="${kind}"] .krow`)].map(r=>{const o={g:r.querySelector('[data-f="g"]').value,t:r.querySelector('[data-f="t"]').value};if(kind==='plan')o.done=r.querySelector('[data-f="done"]').checked;return o});
    const d=editDay(cur);if(kind==='plan')d.karmaPlan=rows;else{d.karmaLog=rows;delete d.karma}
    clearTimeout(save._t);save._t=setTimeout(()=>{refreshSummary();const gp=document.querySelector('.goal-pin');if(gp&&S.config.karmaGoals.length){gp.outerHTML=goalPin();const a=$('#goalNew');if(a)a.onclick=()=>goalForm(false);const b=$('#goalEdit');if(b)b.onclick=()=>goalForm(true)}},500)};
  document.querySelectorAll('.krows').forEach(box=>{const kind=box.dataset.kind;
    box.addEventListener('input',()=>save(kind));
    box.addEventListener('change',e=>{const r=e.target.closest('.krow');if(e.target.matches('select'))r.style.setProperty('--c',KMAP[e.target.value].c);if(e.target.matches('[data-f="done"]'))r.classList.toggle('done',e.target.checked);save(kind)});
    box.addEventListener('click',e=>{const r=e.target.closest('.krow');if(!r)return;
      if(e.target.closest('[data-kdel]')){r.remove();save(kind)}
      if(e.target.closest('[data-kgo]')){const t=r.querySelector('[data-f="t"]').value.trim();if(!t){toast('Nhập nội dung trước khi gieo');return}
        const g=r.querySelector('[data-f="g"]').value;const lb=document.querySelector('.krows[data-kind="log"]');lb.insertAdjacentHTML('beforeend',kRow('log',{g,t}));
        r.querySelector('[data-f="done"]').checked=true;r.classList.add('done');save('plan');save('log');toast('Đã ghi vào nhật ký gieo hạt')}});
  });
  document.querySelectorAll('.quick-add').forEach(q=>q.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const kind=q.dataset.add;const box=document.querySelector(`.krows[data-kind="${kind}"]`);box.insertAdjacentHTML('beforeend',kRow(kind,{g:b.dataset.g,t:''}));box.lastElementChild.querySelector('[data-f="t"]').focus()}));
};

/* ---------- 3. Gratitude ---------- */
const gItems=k=>(getDay(k).grat?.items||[]).filter(x=>(x||'').trim());
const gCount=k=>gItems(k).length;
const gSub=k=>{const g=getDay(k).grat;if(!g)return false;return g.submitted===true||(g.submitted===undefined&&gCount(k)>=10)};
function gratStreaks(){
  const all=allDays();const done=Object.keys(all).filter(gSub).sort();const set=new Set(done);const t=TODAY();
  let streak=0,k=set.has(t)?t:addDays(t,-1);while(set.has(k)){streak++;k=addDays(k,-1)}
  let best=0,run=0,prev=null;for(const d of done){run=(prev&&addDays(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d}
  return{streak,best,total:done.length};
}
const GRAT_METRICS=()=>{const s=gratStreaks();return[
  {label:'Ngày đã biết ơn',fmt:'n',c:'var(--g2)',val:r=>rangeDays(r).filter(gSub).length},
  {label:'Tỉ lệ hoàn thành',fmt:'%',c:'var(--g3)',val:r=>{const d=countDays(r);return d.length?d.filter(gSub).length/d.length*100:0}},
  {label:'Tổng điều biết ơn',fmt:'n',c:'#65A30D',val:r=>rangeDays(r).filter(gSub).reduce((a,k)=>a+gCount(k),0)},
  {label:'Chuỗi ngày liên tiếp 🔥',fmt:'n',c:'#F97316',val:()=>s.streak,noCmp:true,note:`Dài nhất: ${s.best} ngày`},
  {label:'Tổng số ngày từ trước tới nay',fmt:'n',c:'var(--g1)',val:()=>s.total,noCmp:true}]};
SUM.gratitude=()=>{
  const r=curRange();const ds=rangeDays(r).filter(gSub).reverse();const topics=ds.map(k=>getDay(k).grat.topic).filter(x=>(x||'').trim());
  return metricCards(GRAT_METRICS())+`<h4 style="margin:20px 0 8px">🌿 Tổng kết nội dung biết ơn</h4>`+(ds.length?
   `${topics.length?`<div class="topics">${topics.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
   ${ds.map((k,i)=>`<details class="gday" ${i<2?'open':''}><summary>${fmtLong(k)}${getDay(k).grat.topic?` <span class="chip" style="--c:var(--g3)">${esc(getDay(k).grat.topic)}</span>`:''}</summary><ol>${gItems(k).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`).join('')}`
   :'<div class="empty">Chưa có ngày biết ơn nào được gửi trong kỳ này.</div>');
};
VIEWS.gratitude=()=>{
  const g=getDay(cur).grat||{};const items=g.items||[];
  $('#view').innerHTML=`<div class="grid">
   <div class="grat-hero"><div class="row"><div style="flex:1;min-width:220px"><label class="lb" for="gTopic">Chủ đề của ngày (không bắt buộc)</label><input class="f" id="gTopic" value="${esc(g.topic||'')}" placeholder="Ví dụ: Biết ơn cơ thể của mình"></div>
     <div style="text-align:right"><div style="font-size:13px;font-weight:600">Đã ghi</div><div style="font-size:30px;font-weight:800" id="gCounter">0/10</div></div></div></div>
   <div class="card"><h3>10 điều biết ơn ngày ${fmtShort(cur)}</h3><p class="sub">Điền đủ 10 điều rồi bấm “Biết ơn” để ghi nhận ngày hoàn thành</p>
     <div class="grat-list" id="glist">${Array.from({length:10},(_,i)=>`<div class="gitem ${(items[i]||'').trim()?'ok':''}"><span class="n">${i+1}</span><input data-g="${i}" value="${esc(items[i]||'')}" placeholder="Tôi biết ơn…" aria-label="Điều biết ơn ${i+1}"></div>`).join('')}</div>
     <div class="submit-zone"><button class="thank-btn" id="thankBtn">🙏 Biết ơn</button><span class="ai-note" id="thankNote"></span></div></div>
   ${summaryCard('Tổng kết biết ơn','Số ngày hoàn thành, tỉ lệ và nội dung đã ghi nhận trong kỳ',SUM.gratitude)}
   <div class="card"><h3>Lịch biết ơn</h3><p class="sub">Xanh đậm: đã bấm Biết ơn · Xanh nhạt: đang điền dở</p><div id="gcal"></div></div>
  </div>`;
  refreshGrat();
  $('#gTopic').oninput=e=>{const d=editDay(cur);d.grat??={items:[]};d.grat.topic=e.target.value};
  $('#glist').addEventListener('input',e=>{const t=e.target.closest('[data-g]');if(!t)return;const d=editDay(cur);d.grat??={items:[]};d.grat.items??=[];d.grat.items[+t.dataset.g]=t.value;
    t.parentElement.classList.toggle('ok',!!t.value.trim());if(gCount(cur)<10&&d.grat.submitted){d.grat.submitted=false}if(d.grat.submitted===undefined)d.grat.submitted=gCount(cur)>=10;refreshGrat()});
  $('#thankBtn').onclick=()=>{if(gCount(cur)<10)return;const d=editDay(cur);d.grat.submitted=true;d.grat.at=new Date().toISOString();flush();refreshGrat();refreshSummary();toast('🙏 Cảm ơn bạn! Đã ghi nhận 10 điều biết ơn')};
};
function refreshGrat(){
  const c=gCount(cur),sub=gSub(cur);$('#gCounter').textContent=c+'/10';
  const b=$('#thankBtn');b.disabled=c<10&&!sub;b.classList.toggle('sent',sub);b.textContent=sub?'✓ Đã biết ơn':'🙏 Biết ơn';
  $('#thankNote').textContent=sub?'Ngày này đã được tính là hoàn thành. Bạn vẫn có thể chỉnh sửa nội dung.':c<10?`Còn ${10-c} điều nữa để gửi lời biết ơn.`:'Đã đủ 10 điều – bấm “Biết ơn” để ghi nhận.';
  $('#gcal').innerHTML=calendar(k=>{const n=gCount(k);if(!n)return{};const s=gSub(k),t=getDay(k).grat?.topic;
    return{style:`background:${s?'var(--grad);color:#fff':'color-mix(in srgb,var(--g4) 28%,var(--surface-2))'}`,html:`<span class="cal-big">${s?'🙏':n+'/10'}</span>${t?`<span class="snip" style="${s?'color:#fff':''}">${esc(t)}</span>`:''}`,title:t||''}});
}

/* ---------- 4. Order vũ trụ ---------- */
const OCOLS=[{id:'task',name:'Công việc ngày',c:'#16A34A'},{id:'goal',name:'Kết quả mong muốn',c:'#0EA5E9'},{id:'res',name:'Nguồn lực liên quan',c:'#F59E0B'},{id:'real',name:'Thực tế',c:'#7C3AED'}];
const orderRows=k=>(getDay(k).order||[]).filter(r=>OCOLS.some(c=>(r[c.id]||'').trim()));
const ordersIn=r=>rangeDays(r).flatMap(orderRows);
const ORDER_METRICS=()=>[
  {label:'Ngày có order',fmt:'n',c:'var(--g2)',val:r=>rangeDays(r).filter(k=>orderRows(k).length).length},
  {label:'Số đơn đã đặt',fmt:'n',c:'#0EA5E9',val:r=>ordersIn(r).length},

SUM.order=()=>metricCards(ORDER_METRICS());
VIEWS.order=()=>{

  $('#view').innerHTML=`<div class="grid">
   <div class="cosmos"><h3>Đơn đặt hàng gửi vũ trụ · ${fmtLong(cur)}</h3><p>Viết rõ điều bạn muốn, chuẩn bị nguồn lực, rồi cuối ngày ghi lại thực tế đã nhận.</p></div>
   <div class="card"><div class="row"><h3>Bảng order</h3><span class="spacer"></span><button class="btn primary" id="oAdd">+ Thêm công việc</button></div>
     <div class="mx-wrap"><table class="order"><thead><tr>${OCOLS.map(c=>`<th><span style="--c:${c.c}"></span>${c.name}</th>`).join('')}<th></th></tr></thead><tbody id="obody">${rows.map(tr).join('')}</tbody></table></div></div>
   ${summaryCard('Tổng kết order vũ trụ','',SUM.order)}
   <div class="card"><h3>Lịch order</h3><p class="sub">Số đơn đã đặt mỗi ngày · ✓ là đã ghi thực tế</p><div id="ocal"></div></div>
  </div>`;
  const persist=()=>{const d=editDay(cur);d.order=[...document.querySelectorAll('#obody tr')].map(r=>Object.fromEntries(OCOLS.map(c=>[c.id,r.querySelector(`[data-o="${c.id}"]`).value])));

function md(s){
  const lines=esc(s).split('\n');let out='',inList=false;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  for(let l of lines){const t=l.trim();
    const li=t.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if(li){if(!inList){out+='<ul>';inList=true}out+=`<li>${inline(li[2])}</li>`;continue}
    if(inList){out+='</ul>';inList=false}
    if(/^#{1,4}\s/.test(t))out+=`<h4>${inline(t.replace(/^#+\s*/,''))}</h4>`;else if(t)out+=`<p>${inline(t)}</p>`;
  }
  return out+(inList?'</ul>':'');
}

function setupAI(r,ak,build,auto){
  const btn=$('#aiBtn'),note=$('#aiNote'),out=$('#aiOut'),stop=$('#aiStop');if(!btn)return;
  if(!sampleReady)note.textContent='Đang kết nối AI…';
  else if(!SAMPLE){btn.disabled=true;note.textContent='AI chỉ hoạt động khi mở trang trong Claude và đã đăng nhập.'}
  else if(note.textContent==='Đang kết nối AI…')note.textContent='';
  let ctl;
  stop.onclick=()=>ctl?.abort();
  btn.onclick=async()=>{
    if(!SAMPLE){toast('AI chưa sẵn sàng');return}
    const prompt=build(r);
    if(!prompt){toast('Chưa có dữ liệu trong kỳ này');note.textContent='Chưa có dữ liệu trong kỳ này để AI phân tích.';return}
    if(AI_RUNNING.has(ak))return;AI_RUNNING.add(ak);
    btn.disabled=true;stop.style.display='';note.textContent='AI đang đọc dữ liệu…';out.innerHTML='';ctl=new AbortController();
    try{
      const {text,truncated}=await SAMPLE(prompt,{signal:ctl.signal,onText:({text})=>{if($('#aiOut')===out){out.innerHTML=md(text);note.textContent='AI đang viết…'}}});
      AIRES[ak]=text;if($('#aiOut')===out){out.innerHTML=md(text);note.textContent=truncated?'Phân tích bị cắt ngắn – hãy thử kỳ ngắn hơn.':`Phân tích lúc ${new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}`}
    }catch(e){
      if(e?.text)out.innerHTML=md(e.text);
      note.textContent=e?.code==='cancelled'?'Đã dừng.':e?.code==='not_granted'?'Bạn chưa cho phép trang dùng AI.':e?.code==='rate_limited'?'AI đang bận, hãy thử lại sau ít phút.':'Không phân tích được lúc này, hãy thử lại.';
    }finally{AI_RUNNING.delete(ak);btn.disabled=false;stop.style.display='none'}
  };
  if(auto&&SAMPLE&&!AIRES[ak]&&!AI_RUNNING.has(ak)&&build(r))btn.click();
}

function ytId(u){u=(u||'').trim();if(/^[\w-]{11}$/.test(u))return u;
  try{const x=new URL(u.startsWith('http')?u:'https://'+u);const host=x.hostname.replace(/^www\.|^m\./,'');
    if(host==='youtu.be')return x.pathname.slice(1,12)||null;
    if(host.endsWith('youtube.com')||host==='youtube-nocookie.com'){if(x.searchParams.get('v'))return x.searchParams.get('v').slice(0,11);const m=x.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{11})/);if(m)return m[2]}
  }catch(e){}return null}
const ytUrl=(id,orig)=>/\/shorts\//.test(orig||'')?`https://www.youtube.com/shorts/${id}`:`https://www.youtube.com/watch?v=${id}`;
/* Tách link + tiêu đề khi dán cả đoạn chia sẻ (vd: "Tên video – YouTube https://youtu.be/…") */
function splitPaste(text){const m=(text||'').match(/https?:\/\/\S+|(?:www\.|m\.)?(?:youtube\.com|youtu\.be)\/\S+/i);if(!m)return{url:text.trim(),title:''};
  const title=(text.slice(0,m.index)+' '+text.slice(m.index+m[0].length)).replace(/\s*[-–|]\s*YouTube\s*$/i,'').replace(/\s+/g,' ').trim();return{url:m[0],title}}
async function ytTitle(url){
  const tries=[`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`,`https://noembed.com/embed?url=${encodeURIComponent(url)}`];
  for(const t of tries){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),4000);const r=await fetch(t,{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const j=await r.json();if(j&&j.title)return j.title}catch(e){}}
  return null;
}

/* Danh sách tài khoản lưu trên trình duyệt này; mật khẩu chỉ lưu dạng băm kèm muối. */
const ACC_KEY='anvi-accounts',SESS_KEY='anvi-session',DEFAULT_PW='123456';
let ME=null, syncToken=0;
function loadAccounts(){try{const a=JSON.parse(localStorage.getItem(ACC_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveAccounts(list){try{localStorage.setItem(ACC_KEY,JSON.stringify(list));return true}catch(e){toast('Không lưu được tài khoản trên trình duyệt này');return false}}
const normEmail=e=>String(e||'').trim().toLowerCase();
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function fallbackHash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')}
async function hashPw(pw,salt,alg){
  if(alg!=='f'&&window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return{alg:'s',hash:[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}}
  return{alg:'f',hash:fallbackHash(salt+':'+pw)}}
async function setPassword(acc,pw){const salt=uid()+uid();const h=await hashPw(pw,salt);acc.salt=salt;acc.alg=h.alg;acc.hash=h.hash;acc.isDefault=pw===DEFAULT_PW}
async function checkPassword(acc,pw){const h=await hashPw(pw,acc.salt,acc.alg);return h.hash===acc.hash}
async function newAccount(email,role,owner){const a={id:uid()+uid(),email,role,owner:!!owner,created:TODAY()};await setPassword(a,DEFAULT_PW);return a}
function rememberSession(id,remember){try{localStorage.removeItem(SESS_KEY);sessionStorage.removeItem(SESS_KEY);if(id)(remember?localStorage:sessionStorage).setItem(SESS_KEY,id)}catch(e){}}
function sessionId(){try{return sessionStorage.getItem(SESS_KEY)||localStorage.getItem(SESS_KEY)}catch(e){return null}}

function showAuth(msg){
  document.body.classList.add('locked');closeModal();$('#popupOv').classList.remove('open');
  const first=!loadAccounts().length;
  $('#auth').innerHTML=`<form class="auth-box" id="authForm" novalidate>
    <img class="alogo" src="${LOGO}" alt="ANVI">
    <h3>${first?'Tạo tài khoản quản trị':'Đăng nhập ANVI'}</h3>
    <p class="sub">${first?'Lần đầu sử dụng: nhập email để tạo tài khoản quản trị. Dữ liệu đang có trên trình duyệt này sẽ thuộc về tài khoản này.':'Phát triển bản thân mỗi ngày – Thân · Tâm · Tuệ'}</p>
    <div class="fld"><label class="lb" for="auEmail">Email</label><input class="f" id="auEmail" type="email" autocomplete="username" placeholder="ban@email.com"></div>
    ${first?`<p class="pw-hint">Mật khẩu mặc định: <b>${DEFAULT_PW}</b>. Bạn có thể đổi sau khi đăng nhập.</p>`:`<div class="fld"><label class="lb" for="auPw">Mật khẩu</label><input class="f" id="auPw" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <label class="chk"><input type="checkbox" id="auRem" checked> Ghi nhớ đăng nhập trên máy này</label>`}
    <div class="auth-err" id="auErr" role="alert">${esc(msg||'')}</div>
    <button class="btn primary" type="submit">${first?'Tạo tài khoản & vào ứng dụng':'Đăng nhập'}</button>
    <p class="auth-note">${first?'Sau đó, vào mục <b>Tài khoản</b> trên menu để tạo tài khoản cho người khác.':'Quên mật khẩu? Nhờ quản trị viên đặt lại về mật khẩu mặc định.'}</p>
  </form>`;
  setTimeout(()=>$('#auEmail').focus(),30);
  $('#authForm').onsubmit=async e=>{
    e.preventDefault();const err=$('#auErr');const email=normEmail($('#auEmail').value);
    if(!validEmail(email)){err.textContent='Email chưa đúng định dạng';$('#auEmail').focus();return}
    const list=loadAccounts();
    if(!list.length){const a=await newAccount(email,'admin',true);if(!saveAccounts([a]))return;rememberSession(a.id,true);enterApp(a);return}
    const pw=$('#auPw').value;const a=list.find(x=>x.email===email);
    if(!a||!pw||!(await checkPassword(a,pw))){err.textContent='Email hoặc mật khẩu không đúng';$('#auPw').select();return}
    rememberSession(a.id,$('#auRem').checked);enterApp(a);
  };
}

  openModal(`<h3>${suggest?'Bạn có muốn đổi mật khẩu?':'Đổi mật khẩu'}</h3>
   ${suggest?`<p class="sub">Tài khoản đang dùng mật khẩu mặc định <b>${DEFAULT_PW}</b>. Bạn có thể đổi ngay hoặc để sau – không bắt buộc.</p>`:''}
   <div class="fld"><label class="lb" for="pwOld">Mật khẩu hiện tại</label><input class="f" id="pwOld" type="password" autocomplete="current-password" ${suggest?`value="${DEFAULT_PW}"`:''}></div>
   <div class="fld"><label class="lb" for="pwNew">Mật khẩu mới (ít nhất 6 ký tự)</label><input class="f" id="pwNew" type="password" autocomplete="new-password"></div>
   <div class="fld"><label class="lb" for="pwNew2">Nhập lại mật khẩu mới</label><input class="f" id="pwNew2" type="password" autocomplete="new-password"></div>
   <div class="auth-err" id="pwErr" role="alert"></div>
   <div class="row"><span class="spacer"></span><button class="btn" data-close>${suggest?'Để sau':'Huỷ'}</button><button class="btn primary" id="pwSave">Đổi mật khẩu</button></div>`);
  setTimeout(()=>$(suggest?'#pwNew':'#pwOld').focus(),50);
  $('#pwSave').onclick=async()=>{
    const err=$('#pwErr'),o=$('#pwOld').value,n=$('#pwNew').value,n2=$('#pwNew2').value;
    const list=loadAccounts();const a=list.find(x=>x.id===ME.id);if(!a){logout();return}
    if(!(await checkPassword(a,o))){err.textContent='Mật khẩu hiện tại không đúng';$('#pwOld').select();return}
    if(n.length<6){err.textContent='Mật khẩu mới cần ít nhất 6 ký tự';$('#pwNew').focus();return}
    if(n!==n2){err.textContent='Hai lần nhập mật khẩu mới chưa khớp';$('#pwNew2').select();return}
    await setPassword(a,n);if(!saveAccounts(list))return;ME=a;closeModal();if(tab==='account')render();toast('Đã đổi mật khẩu');
  };
}

VIEWS.account=()=>{
  const list=loadAccounts();const me=list.find(x=>x.id===ME.id)||ME;ME=me;const admin=me.role==='admin';
  const badges=a=>`<span class="badge ${a.role==='admin'?'admin':''}">${a.role==='admin'?(a.owner?'Quản trị (chủ)':'Quản trị'):'Thành viên'}</span>${a.isDefault?'<span class="badge warn">Mật khẩu mặc định</span>':'<span class="badge ok">Đã đổi mật khẩu</span>'}`;
  $('#view').innerHTML=`<div class="grid">
   <div class="card"><div class="acc-me"><span class="av">${esc(me.email[0].toUpperCase())}</span>
     <div class="info"><b>${esc(me.email)}</b><span>Tạo ngày ${fmtShortY(me.created||TODAY())}</span><div class="row" style="margin-top:6px">${badges(me)}</div></div>
     <div class="row"><button class="btn primary" id="accPw">Đổi mật khẩu</button><button class="btn" id="accOut">Đăng xuất</button></div></div>
     <p class="pw-hint">Mỗi tài khoản có dữ liệu riêng (thói quen, nhật ký, nghiệp, biết ơn, video, châm ngôn…), không lẫn với tài khoản khác. Đổi mật khẩu là tuỳ chọn.</p></div>
   ${admin?`<div class="card"><div class="sec-title"><h3>👥 Tạo tài khoản đăng nhập</h3></div>
     <p class="sub">Tài khoản mới đăng nhập bằng email, mật khẩu mặc định <b>${DEFAULT_PW}</b>. Người dùng có thể tự đổi mật khẩu sau khi vào.</p>
     <form class="acc-add" id="accAdd" novalidate>
       <div class="fld"><label class="lb" for="accEmail">Email</label><input class="f" id="accEmail" type="email" placeholder="nguoidung@email.com" autocomplete="off"></div>
       <div class="fld"><label class="lb" for="accRole">Quyền</label><select class="f" id="accRole"><option value="member">Thành viên</option><option value="admin">Quản trị</option></select></div>
       <button class="btn primary" type="submit">+ Tạo tài khoản</button>
     </form>
     <div class="acc-list" id="accList">${list.map(a=>`<div class="acc-row" data-acc="${a.id}">
       <div class="em">${esc(a.email)}${a.id===me.id?' <small>(bạn)</small>':`<small>Tạo ngày ${fmtShortY(a.created||TODAY())}</small>`}</div>${badges(a)}
       ${a.id===me.id||a.owner?'':`<button class="btn sm" data-act="reset">Đặt lại mật khẩu</button><button class="btn sm" data-act="del" aria-label="Xoá tài khoản ${esc(a.email)}">Xoá</button>`}</div>`).join('')}</div>
     <p class="pw-hint">Tài khoản và dữ liệu được lưu trên trình duyệt của thiết bị này. Người dùng khác cần đăng nhập trên cùng thiết bị / trình duyệt.</p></div>`:''}
  </div>`;
  $('#accPw').onclick=()=>pwForm(false);
  $('#accOut').onclick=logout;
  if(!admin)return;
  $('#accAdd').onsubmit=async e=>{e.preventDefault();const email=normEmail($('#accEmail').value);
    if(!validEmail(email)){toast('Email chưa đúng định dạng');$('#accEmail').focus();return}
    const l=loadAccounts();if(l.some(x=>x.email===email)){toast('Email này đã có tài khoản');$('#accEmail').select();return}
    l.push(await newAccount(email,$('#accRole').value,false));if(!saveAccounts(l))return;render();toast(`Đã tạo tài khoản ${email} – mật khẩu ${DEFAULT_PW}`)};
  $('#accList').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('[data-acc]').dataset.acc;
    const l=loadAccounts();const a=l.find(x=>x.id===id);if(!a||a.owner||a.id===me.id)return;
    if(b.dataset.act==='reset'){if(!(await ask(`Đặt lại mật khẩu của ${a.email} về ${DEFAULT_PW}?`,'Đặt lại')))return;await setPassword(a,DEFAULT_PW);saveAccounts(l);render();toast('Đã đặt lại mật khẩu về '+DEFAULT_PW)}
    if(b.dataset.act==='del'){if(!(await ask(`Xoá tài khoản ${a.email} và toàn bộ dữ liệu của tài khoản này?`)))return;
      saveAccounts(l.filter(x=>x.id!==id));try{localStorage.removeItem(LS_BASE+':'+id)}catch(e){}render();toast('Đã xoá tài khoản')}};
};

/* ---------- Boot ---------- */
const API=window.claude&&window.claude.use?window.claude:null;
let sampleStarted=false;
function startSample(){if(sampleStarted)return;sampleStarted=true;
  if(API){API.use('sample').then(s=>{SAMPLE=s;sampleReady=true;if(window.AI_HOOK)AI_HOOK();}).catch(()=>{sampleReady=true})}
  else sampleReady=true}
async function syncCloud(acc){
  const my=syncToken;
  try{
    if(!API){setStatus('local');return}
    const [db,user]=await Promise.all([API.use('db'),API.use('user')]);
    if(!db||!user){setStatus('local');return}
    const id=await user.id();if(!id){setStatus('local');return}
    const c=db.collection('data/users/'+id);
    const snap=await c.limit(1000).get();
    if(my!==syncToken)return;
    const fresh={config:null,months:{}};let found=false;
    snap.docs.forEach(d=>{if(!d.id.startsWith(DOCP))return;const n=d.id.slice(DOCP.length);const v=JSON.parse(JSON.stringify(d.data()||{}));
      if(n==='config'){fresh.config=v;found=true}else if(n.startsWith('m-')){fresh.months[n.slice(2)]=v;found=true}});
    col=c;
    if(!found){pending.add('config');Object.keys(S.months).forEach(m=>pending.add('m-'+m));await flush()}
    else{
      for(const n of pending){if(n==='config')fresh.config=S.config;else fresh.months[n.slice(2)]=S.months[n.slice(2)]}
      fresh.config=normalizeConfig(fresh.config||S.config);
      S=fresh;saveLocal();
      const a=document.activeElement;if(!a||!$('#view').contains(a)||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render();
      setStatus(pending.size?'saving':'cloud');if(pending.size)flush();
    }
  }catch(e){if(my===syncToken){col=null;setStatus('local')}}
}
(()=>{const id=sessionId();const a=id&&loadAccounts().find(x=>x.id===id);if(a)enterApp(a);else{rememberSession(null);showAuth()}})();
</script>
